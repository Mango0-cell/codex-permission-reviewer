name: CI
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run test:package
      - run: node dist/.github/release/verify-source-install.js
  windows-approval-memory:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: node --test dist/tests/approval-memory.test.js
  release-validation:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm ci --prefix .github/release --ignore-scripts
      - name: Verify release tools and commit mapping without publishing
        run: node dist/.github/release/verify-release-tooling.js
      - name: Smoke test the prepare hook through semantic-release's plugin loader
        run: node dist/.github/release/verify-prepare-smoke.js
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, windows-approval-memory, release-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Verify this is still the latest main commit
        id: head
        run: |
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release because main advanced after this CI run."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install application build tools
        if: steps.head.outputs.current == 'true'
        run: npm ci --ignore-scripts
      - name: Build the typed release plugin
        if: steps.head.outputs.current == 'true'
        run: npm run build
      - name: Install isolated release tooling
        if: steps.head.outputs.current == 'true'
        run: npm ci --prefix .github/release --ignore-scripts
      - name: Create GitHub release and installable archive
        if: steps.head.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          askpass="$RUNNER_TEMP/release-git-askpass"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 node .github/release/node_modules/semantic-release/bin/semantic-release.js
